<svg width="1280" height="240" viewBox="0 0 1280 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">tmux-web-manager wordmark</title>
  <desc id="desc">Stylized tmux-web-manager wordmark with cyber terminal accents.</desc>
  <style>
    .frame { fill: #0b1020; stroke: #2bf0ff; stroke-width: 4; }
    .glow { fill: #2bf0ff; opacity: 0.14; }
    .cut { fill: #ff4fd8; }
    .text-main { fill: #f5f7ff; font: 800 78px/1.05 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; letter-spacing: 2px; }
    .text-sub { fill: #9fb3c8; font: 600 22px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; letter-spacing: 4px; }
    @media (prefers-color-scheme: light) {
      .frame { fill: #ecf4ff; stroke: #007e8a; }
      .glow { fill: #00d5ff; opacity: 0.10; }
      .text-main { fill: #08101f; }
      .text-sub { fill: #34506a; }
    }
  </style>
  <rect x="18" y="24" width="1244" height="192" rx="22" class="frame"/>
  <rect x="48" y="52" width="1184" height="136" rx="14" class="glow"/>
  <rect x="56" y="64" width="170" height="10" rx="5" class="cut"/>
  <rect x="1050" y="64" width="170" height="10" rx="5" class="cut"/>
  <rect x="56" y="166" width="112" height="10" rx="5" class="cut"/>
  <text x="74" y="136" class="text-main">tmux-web-manager</text>
  <text x="78" y="182" class="text-sub">HUB // AGENT // PANE ORCHESTRATION</text>
</svg>
